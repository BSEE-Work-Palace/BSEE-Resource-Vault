<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSEE Resource Vault</title>

    <meta name="description"
          content="BSEE Resource Vault - Electrical Engineering study resources, projects, past papers and senior batch archives.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(30, 70, 255, 0.16), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0, 170, 255, 0.10), transparent 30%),
                #050B24;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
        }

        /* NAVBAR */
        .navbar {
            padding: 22px 0;
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .logo span {
            color: #38BDF8;
        }

        .contact-btn {
            border: 1px solid #245CFF;
            background: rgba(20, 35, 90, 0.6);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .contact-btn:hover {
            background: #1746FF;
            transform: translateY(-2px);
        }

        /* HERO */
        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(65,105,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(65,105,255,0.05) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 750px;
        }

        .small-title {
            color: #38BDF8;
            font-weight: 700;
            letter-spacing: 4px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(42px, 8vw, 82px);
            line-height: 0.98;
            margin-bottom: 25px;
        }

        h1 span {
            color: #38BDF8;
        }

        .subtitle {
            color: #B7C6E8;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .motto {
            color: #6FA8FF;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        .start-btn {
            display: inline-block;
            padding: 14px 32px;
            background: #1746FF;
            border: 1px solid #38BDF8;
            border-radius: 9px;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .start-btn:hover {
            background: #245CFF;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(36, 92, 255, 0.25);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(470px, 100%);
            background: #0B1433;
            border: 1px solid #245CFF;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 16px;
            top: 14px;
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .contact-item {
            padding: 17px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .contact-item:first-of-type {
            border-top: none;
        }

        .contact-name {
            font-weight: 700;
            margin-bottom: 7px;
        }

        .contact-email {
            color: #5DA7FF;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 0;
            }

            .logo {
                font-size: 16px;
            }

            .hero {
                min-height: calc(100vh - 70px);
            }

            .subtitle {
                font-size: 16px;
            }

            .motto {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="container nav-inner">
        <div class="logo">
            BSEE <span>RESOURCE VAULT</span>
        </div>

        <button class="contact-btn" onclick="openContact()">
            Contact
        </button>
    </div>
</header>

<main class="hero">
    <div class="container hero-content">

        <div class="small-title">
            ELECTRICAL ENGINEERING
        </div>

        <h1>
            Welcome to<br>
            <span>BSEE Resource Vault</span>
        </h1>

        <p class="subtitle">
            Your Electrical Engineering Resource Hub
        </p>

        <p class="motto">
            LEARN • PREPARE • BUILD • GROW
        </p>

        <a href="resources.html" class="start-btn">
            GET STARTED
        </a>

    </div>
</main>

<!-- CONTACT MODAL -->
<div class="modal" id="contactModal" onclick="closeOutside(event)">
    <div class="modal-box">

        <button class="close-btn" onclick="closeContact()" aria-label="Close">
            &times;
        </button>

        <div class="modal-title">
            ✉ For Help Contact:
        </div>

        <div class="contact-item">
            <div class="contact-name">Muhammad Uzair</div>
            <a class="contact-email"
               href="mailto:muhduzair0179@gmail.com">
                muhduzair0179@gmail.com
            </a>
        </div>

        <div class="contact-item">
            <div class="contact-name">Asad Javed</div>
            <a class="contact-email"
               href="mailto:javedasad002@gmail.com">
                javedasad002@gmail.com
            </a>
        </div>

        <div class="contact-item">
            <div class="contact-name">Aqsa Noor</div>
            <a class="contact-email"
               href="mailto:aqsa36noor36@gmail.com">
                aqsa36noor36@gmail.com
            </a>
        </div>

    </div>
</div>

<script>
    const modal = document.getElementById("contactModal");

    function openContact() {
        modal.classList.add("show");
    }

    function closeContact() {
        modal.classList.remove("show");
    }

    function closeOutside(event) {
        if (event.target === modal) {
            closeContact();
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeContact();
        }
    });
</script>

</body>
</html>

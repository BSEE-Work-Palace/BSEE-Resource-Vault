<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSEE Resource Vault</title>

    <meta
        name="description"
        content="BSEE Resource Vault - Electrical Engineering Resource Hub"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="landing-page">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="brand">

                <span class="brand-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M13.1 2 5 13h5.4L9.8 22 19 9h-5.7z"/>
                    </svg>
                </span>

                <span class="brand-text">
                    BSEE
                    <strong>RESOURCE VAULT</strong>
                </span>

            </a>

            <button
                class="contact-btn"
                type="button"
                data-contact-open
            >
                Contact
            </button>

        </div>
    </header>


    <!-- =========================
         HERO
    ========================== -->
    <main class="hero">

        <div class="hero-grid"></div>

        <div class="hero-orb hero-orb-one"></div>
        <div class="hero-orb hero-orb-two"></div>

        <div class="container hero-content">

            <div class="hero-logo">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M13.1 2 5 13h5.4L9.8 22 19 9h-5.7z"/>
                </svg>

            </div>

            <div class="hero-kicker">
                BACHELOR OF SCIENCE IN ELECTRICAL ENGINEERING
            </div>

            <h1>
                Welcome to
                <span>BSEE Resource Vault</span>
            </h1>

            <a
                href="resources.html"
                class="primary-btn"
            >
                <span>GET STARTED</span>

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14"/>
                    <path d="m13 6 6 6-6 6"/>
                </svg>
            </a>

        </div>

    </main>


    <!-- =========================
         CONTACT MODAL
    ========================== -->
    <div
        class="modal"
        id="contactModal"
        aria-hidden="true"
    >

        <div
            class="modal-overlay"
            data-contact-close
        ></div>

        <div
            class="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="contactTitle"
        >

            <button
                class="modal-close"
                type="button"
                aria-label="Close contact window"
                data-contact-close
            >
                &times;
            </button>

            <div class="modal-heading-icon">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16v16H4z"/>
                    <path d="m4 6 8 6 8-6"/>
                </svg>

            </div>

            <h2 id="contactTitle">
                For Help Contact
            </h2>

            <div class="contact-list">

                <div class="contact-item">
                    <h3>Muhammad Uzair</h3>

                    <a href="mailto:muhduzair0179@gmail.com">
                        muhduzair0179@gmail.com
                    </a>
                </div>

                <div class="contact-item">
                    <h3>Asad Javed</h3>

                    <a href="mailto:javedasad002@gmail.com">
                        javedasad002@gmail.com
                    </a>
                </div>

                <div class="contact-item">
                    <h3>Aqsa Noor</h3>

                    <a href="mailto:aqsa36noor36@gmail.com">
                        aqsa36noor36@gmail.com
                    </a>
                </div>

            </div>

        </div>

    </div>


    <script src="js/main.js"></script>

</body>
</html>
